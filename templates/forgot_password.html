<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ 'rtl' if locale == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('web.auth.forgot.pageTitle') }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap{% if locale == 'ar' %}.rtl{% endif %}.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tajawal Arabic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- Global custom styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --primary-orange: #FF7A00;
            --primary-blue: #1E90FF;
            --light-gray: #f8f9fa;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--light-gray);
            min-height: 100vh;
            display: flex;
            align-items: center;
            background-image: url("../static/images/auth-bg.jpg");
            background-size: cover;
            background-position: center;
        }
        
        .forgot-container {
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            margin: 2rem auto;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .logo-image {
            height: 100px;
            width: auto;
            transition: transform 0.3s ease;
        }
        
        .logo-image:hover {
            transform: scale(1.05);
        }
        
        .logo-text {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        
        .logo-text span:first-child {
            color: var(--primary-orange);
        }
        
        .logo-text span:last-child {
            color: var(--primary-blue);
        }
        
        .form-control {
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(30, 144, 255, 0.25);
        }
        
        .btn-reset {
            background-color: var(--primary-orange);
            border: none;
            padding: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        
        .btn-reset:hover {
            background-color: #e06d00;
            transform: translateY(-2px);
        }
        
        .btn-back {
            background-color: var(--primary-blue);
            border: none;
            padding: 0.75rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            background-color: #187bcd;
            transform: translateY(-2px);
        }
        
        .info-text {
            background-color: rgba(30, 144, 255, 0.1);
            border: 1px solid rgba(30, 144, 255, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: var(--primary-blue);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        /* Responsive adjustments */
        @media (max-width: 576px) {
            .forgot-container {
                padding: 1.5rem;
                margin: 1rem;
            }
            
            .logo-image {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="forgot-container">
            <!-- Logo Section -->
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="UpKeep Logo"
                     class="logo-image">
                <div class="logo-text">
                    <span>Up</span><span>Keep</span>
                </div>
                <p class="text-muted">{{ t('web.auth.forgot.subtitle') }}</p>
            </div>
            
            <div class="info-text">
                <i class="fas fa-info-circle me-2"></i>
                {{ t('web.auth.forgot.intro') }}
            </div>
            
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-2" style="color: var(--primary-blue);"></i>
                        {{ t('web.auth.forgot.email') }}
                    </label>
                    <input type="email" 
                           class="form-control" 
                           id="email" 
                           name="email"
                           placeholder="{{ t('login.form.email.placeholder') }}" 
                           required>
                </div>
                
                <button type="submit" 
                        class="btn btn-primary btn-reset w-100 mb-3">
                    <i class="fas fa-paper-plane me-2"></i>
                    {{ t('web.auth.forgot.submit') }}
                </button>
                
                <a href="{{ url_for('login') }}" 
                   class="btn btn-outline-primary btn-back w-100">
                    <i class="fas fa-arrow-right me-2"></i>
                    {{ t('web.auth.forgot.backLogin') }}
                </a>
            </form>
            
            <div class="auth-footer">
                {{ t('web.auth.forgot.remember') }}
                <a href="{{ url_for('login') }}" style="color: var(--primary-orange); font-weight: bold;">{{ t('web.auth.forgot.signIn') }}</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Simple animation for form elements
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('.form-control');
            
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.querySelector('label').style.color = 'var(--primary-blue)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.querySelector('label').style.color = '';
                });
            });
        });
    </script>
</body>
</html>
