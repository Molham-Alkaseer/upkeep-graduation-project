{% extends "base.html" %}

{% block title %}UpKeep — {{ t('web.errorPages.404.title') }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body py-5">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                    <h1 class="display-4 text-muted">404</h1>
                    <h3 class="mb-4">{{ t('web.errorPages.404.title') }}</h3>
                    <p class="text-muted mb-4">{{ t('web.errorPages.404.body') }}</p>
                    <div class="d-grid gap-2 d-md-block">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>
                            {{ t('web.errorPages.404.home') }}
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-right me-2"></i>
                            {{ t('web.errorPages.404.back') }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
